enter_accept = false
exit_mode = "return-query"
invert = true
keymap_mode = "vim-insert"
show_help = false
show_preview = false
show_tabs = false

[search]
filters = ["global", "session", "workspace"]

[keys]
scroll_exits = false

[ui]
columns = ["command"]

[daemon]
autostart = true
enabled = true

[threads]
capture = true

[threads.resume]
claude = "tuios-thread-open {id} claude --resume {id}"
codex = "tuios-thread-open {id} codex resume {id}"
