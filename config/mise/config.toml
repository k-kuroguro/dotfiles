[settings]
disable_backends = ["npm", "asdf", "vfox", "ubi"]
minimum_release_age = "7d"
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[tools]
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:anthropics/claude-code" = "2.1.307"
"aqua:antonmedv/fx" = "40.0.0"
"aqua:ast-grep/ast-grep" = "0.51.0"
"aqua:astral-sh/uv" = "0.13.4"
"aqua:betterleaks/betterleaks" = "1.9.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:casey/just" = "1.58.0"
"aqua:ClementTsang/bottom" = "0.14.9"
"aqua:cli/cli" = "2.102.0"
"aqua:eza-community/eza" = "0.23.5"
"aqua:Gaurav-Gosain/tuios" = "0.12.0"
"aqua:j178/prek" = "0.5.7"
"aqua:junegunn/fzf" = "0.74.5"
"aqua:loeffel-io/ls-lint" = "2.3.2"
"aqua:max-sixty/worktrunk" = "0.81.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:mozilla/sccache" = "0.18.0"
"aqua:neovim/neovim" = "0.12.6"
"aqua:Nukesor/pueue/pueue" = "4.0.4"
"aqua:Nukesor/pueue/pueued" = "4.0.4"
"aqua:openai/codex" = "0.162.1"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:rossmacarthur/sheldon" = "0.8.5"
"aqua:rui314/mold" = "3.0.0"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:sharkdp/hyperfine" = "2.0.0"
"aqua:suzuki-shunsuke/pinact" = "5.0.0"
"aqua:svenstaro/miniserve" = "0.35.0"
"aqua:tree-sitter/tree-sitter" = "0.27.1"
"aqua:watchexec/watchexec" = "2.8.0"
"aqua:x-motemen/ghq" = "1.11.2"
"core:deno" = "2.9.8"
"core:rust" = { version = "1.99.0", profile = "default" }
"github:AltanS/collie" = "1.24.0"
"github:microsoft/apm" = "0.35.0"

[dotfiles]
"~/.cargo/config.toml" = "~/dotfiles/config/cargo/config.toml"
"~/.clang-format" = "~/dotfiles/config/clang-format/.clang-format"
"~/.config/bat" = "~/dotfiles/config/bat"
"~/.config/bottom" = "~/dotfiles/config/bottom"
"~/.config/fd" = "~/dotfiles/config/fd"
"~/.config/git" = "~/dotfiles/config/git"
"~/.config/just" = "~/dotfiles/config/just"
"~/.config/mise" = "~/dotfiles/config/mise"
"~/.config/nvim" = "~/dotfiles/config/nvim"
"~/.config/ruff" = "~/dotfiles/config/ruff"
"~/.config/rustfmt" = "~/dotfiles/config/rustfmt"
"~/.config/tuios" = "~/dotfiles/config/tuios"
"~/.config/zsh" = "~/dotfiles/config/zsh"
"~/.collie/config.toml" = "~/dotfiles/config/collie/config.toml"
"~/.zshenv" = "~/dotfiles/config/.zshenv"

[bootstrap.repos]
"~/dotfiles" = { url = "https://github.com/k-kuroguro/dotfiles", ref = "main" }
